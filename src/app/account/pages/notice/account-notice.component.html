<main class="grid min-h-screen place-items-center bg-cream px-4 py-12">
  <div class="w-full max-w-md rounded-xl border border-line bg-white p-8 text-center">
    <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-sand text-twilight">
      <ion-icon name="information-circle-outline" class="text-2xl"></ion-icon>
    </span>
    <span class="mt-4 block text-[11px] font-semibold uppercase tracking-[0.18em] text-star">{{ t().accEyebrow }}</span>
    <h1 class="mt-2 text-xl font-semibold tracking-tight text-twilight">{{ title() }}</h1>
    <p class="mt-2 text-[13px] text-muted">{{ body() }}</p>
    <a [href]="workspaceUrl"
      class="mt-6 inline-block rounded-lg bg-twilight px-4 py-2 text-[13px] font-semibold text-white hover:bg-star">
      {{ t().accSignInCta }}
    </a>
  </div>
</main>
