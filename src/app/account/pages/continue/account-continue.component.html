<main class="grid min-h-screen place-items-center bg-[#FAFAFA] px-4 py-12">
  <div class="w-full max-w-md rounded-3xl border border-gray-200 bg-white p-8 text-center">
    @if (failed()) {
      <h1 class="text-xl font-bold text-ink">{{ t().accContinueFailedTitle }}</h1>
      <p class="mt-2 text-sm text-gray-500">{{ t().accContinueFailedBody }}</p>
      <a [href]="workspaceUrl"
        class="mt-6 inline-block rounded-full btn-brand-gradient px-5 py-2.5 text-sm font-semibold text-white">
        {{ t().accSignInCta }}
      </a>
    } @else {
      <span class="mx-auto block h-8 w-8 animate-spin rounded-full border-2 border-brand-100 border-t-brand-600"
        role="status" [attr.aria-label]="t().accLoading"></span>
      <h1 class="mt-5 text-xl font-bold text-ink">{{ t().accContinueTitle }}</h1>
      <p class="mt-2 text-sm text-gray-500">{{ t().accContinueBody }}</p>
    }
  </div>
</main>
