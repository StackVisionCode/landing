<main class="grid min-h-screen place-items-center bg-[#FAFAFA] px-4 py-12">
  <div class="w-full max-w-md rounded-2xl border border-line bg-white p-8 text-center">
    @if (failed()) {
      <h1 class="text-xl font-bold text-ink">{{ t().accContinueFailedTitle }}</h1>
      <p class="mt-2 text-sm text-muted">{{ t().accContinueFailedBody }}</p>
      <a [href]="workspaceUrl"
        class="mt-6 inline-block rounded-lg bg-twilight px-5 py-2.5 text-sm font-semibold text-white hover:bg-star">
        {{ t().accSignInCta }}
      </a>
    } @else {
      <span class="mx-auto flex justify-center"><app-infinity-loader size="md" [label]="t().accLoading" /></span>
      <h1 class="mt-5 text-xl font-bold text-ink">{{ t().accContinueTitle }}</h1>
      <p class="mt-2 text-sm text-muted">{{ t().accContinueBody }}</p>
    }
  </div>
</main>
