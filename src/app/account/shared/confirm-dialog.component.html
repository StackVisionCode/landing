@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-twilight/40 px-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
  >
    <div class="w-full max-w-md rounded-2xl border border-line bg-white p-6 shadow-xl">
      <h2 class="text-lg font-semibold text-twilight">{{ title() }}</h2>
      @if (message()) {
        <p class="mt-2 text-[13px] text-muted">{{ message() }}</p>
      }

      <div class="mt-5 flex justify-end gap-3">
        <button
          type="button"
          (click)="dismiss()"
          [disabled]="submitting()"
          class="rounded-lg border border-line bg-white px-4 py-2 text-[13px] font-semibold text-twilight hover:bg-cream disabled:opacity-60"
        >
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          (click)="confirm()"
          [disabled]="submitting()"
          [class]="'rounded-lg px-4 py-2 text-[13px] font-semibold disabled:opacity-60 ' + confirmClasses()"
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
