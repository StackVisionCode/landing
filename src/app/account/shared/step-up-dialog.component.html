<div class="fixed inset-0 z-50 flex items-center justify-center bg-twilight/40 px-4" role="dialog" aria-modal="true"
  [attr.aria-label]="t().accStepUpTitle">
  <div class="w-full max-w-md rounded-2xl border border-line bg-white p-6 shadow-xl">
    <h2 class="text-lg font-semibold text-twilight">{{ t().accStepUpTitle }}</h2>
    <p class="mt-1 text-[13px] text-muted">{{ t().accStepUpSubtitle }}</p>

    <form class="mt-5 space-y-4" (ngSubmit)="submit()">
      <div>
        <label for="stepUpPassword" class="block text-[13px] font-semibold text-twilight">{{ t().accStepUpPassword }}</label>
        <input id="stepUpPassword" type="password" name="password" autocomplete="current-password" required
          [ngModel]="password()" (ngModelChange)="password.set($event)"
          class="mt-1 w-full rounded-lg border border-line bg-cream px-3.5 py-2.5 text-sm text-twilight focus:border-star focus:outline-none focus:ring-2 focus:ring-star/25" />
      </div>

      <div>
        <label for="stepUpCode" class="block text-[13px] font-semibold text-twilight">{{ t().accStepUpCode }}</label>
        <input id="stepUpCode" type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
          [ngModel]="code()" (ngModelChange)="code.set($event)"
          class="mt-1 w-full rounded-lg border border-line bg-cream px-3.5 py-2.5 text-sm text-twilight focus:border-star focus:outline-none focus:ring-2 focus:ring-star/25" />
        <p class="mt-1 text-xs text-muted">{{ t().accStepUpCodeHint }}</p>
      </div>

      @if (error(); as message) {
        <p role="alert" class="rounded-lg border border-twilight/40 bg-sand px-4 py-3 text-sm text-twilight">{{ message }}</p>
      }

      <div class="flex justify-end gap-3 pt-1">
        <button type="button" (click)="dismiss()"
          class="rounded-lg border border-line bg-white px-4 py-2 text-[13px] font-semibold text-twilight hover:bg-cream">
          {{ t().accStepUpCancel }}
        </button>
        <button type="submit" [disabled]="submitting() || !password()"
          class="rounded-lg bg-twilight px-4 py-2 text-[13px] font-semibold text-white hover:bg-star disabled:opacity-60">
          {{ submitting() ? t().accStepUpConfirming : t().accStepUpConfirm }}
        </button>
      </div>
    </form>
  </div>
</div>
