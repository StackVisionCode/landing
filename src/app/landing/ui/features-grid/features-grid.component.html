<section id="features" class="mx-auto max-w-7xl px-4 py-20 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-2xl text-center">
    <span class="rounded-full border border-brand-200 px-3 py-1 text-xs font-semibold text-brand-800">{{ t().featuresBadge }}</span>
    <h2 class="mt-4 text-3xl font-bold text-gray-900 sm:text-4xl" [innerHTML]="t().featuresMainTitleHtml"></h2>
    <p class="mt-4 text-gray-500">{{ t().featuresSubtitle }}</p>
  </div>

  <div class="mt-12 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
    @for (module of modules; track module.key) {
      <button
        type="button"
        (click)="open(module)"
        class="flex flex-col items-start gap-3 rounded-xl border border-gray-200 bg-white p-5 text-left transition-all hover:-translate-y-1 hover:border-brand-300 hover:shadow-lg"
      >
        <span class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-50 text-brand-800">
          <ion-icon [name]="module.icon" class="text-xl"></ion-icon>
        </span>
        <h3 class="text-sm font-bold text-gray-900">{{ module.label }}</h3>
      </button>
    }
  </div>
</section>

<app-modal [isOpen]="selected() !== null" [heading]="selected()?.label ?? ''" size="md" (closed)="close()">
  @if (selected(); as module) {
    <div class="mt-4 flex items-center gap-3">
      <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-800">
        <ion-icon [name]="module.icon" class="text-2xl"></ion-icon>
      </span>
      <p class="text-sm text-gray-600">{{ module.description }}</p>
    </div>
  }
</app-modal>
