<section class="mx-auto max-w-7xl px-4 py-20 sm:px-6 lg:px-8">
  <div class="cta-banner-bg relative overflow-hidden rounded-[28px] px-6 py-16 text-center sm:px-16">
    <h2 class="text-3xl font-bold leading-tight text-white sm:text-4xl" [innerHTML]="t().ctaMainTitleHtml"></h2>
    <p class="mx-auto mt-4 max-w-xl text-gray-300">{{ t().ctaMainSubtitle }}</p>

    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a
        href="#pricing"
        class="rounded-full bg-white px-7 py-3 text-sm font-semibold text-gray-900 transition-colors hover:bg-gray-100"
      >
        {{ t().startNowButton }}
      </a>
      <button
        type="button"
        (click)="showBooking.set(true)"
        class="rounded-full border border-white/30 px-7 py-3 text-sm font-semibold text-white transition-colors hover:bg-white/10"
      >
        {{ t().scheduleDemoButton }}
      </button>
    </div>
  </div>
</section>

<app-booking-modal
  [bookingId]="bookingId"
  [isOpen]="showBooking()"
  [heading]="t().scheduleDemoButton"
  (closed)="showBooking.set(false)"
/>
