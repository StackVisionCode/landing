<section class="relative overflow-hidden bg-white px-4 pb-6 pt-14 sm:px-8 sm:pt-20 lg:px-16 lg:pt-[88px]">
  <div class="mx-auto flex max-w-4xl flex-col items-center gap-5 text-center">
    <h2 class="font-display text-3xl font-semibold leading-tight tracking-[-0.03em] text-twilight sm:text-5xl">
      {{ t().cta.titleA }}
      <span class="text-star">{{ t().cta.titleB }}</span>
    </h2>
    <p class="max-w-xl text-[15px] text-muted">{{ t().cta.subtitle }}</p>
    <div class="flex flex-col items-center gap-3 sm:flex-row">
      <button
        type="button"
        (click)="booking.open('cta')"
        class="rounded-full bg-twilight px-7 py-3.5 text-sm font-semibold text-white transition-colors hover:bg-star"
      >
        {{ t().scheduleDemo }}
      </button>
      <a
        href="#pricing"
        class="inline-flex items-center gap-2 rounded-full border border-twilight/20 bg-white px-7 py-3.5 text-sm font-semibold text-twilight transition-colors hover:border-twilight"
      >
        {{ t().startNow }}
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </a>
    </div>
  </div>

  <footer class="mt-14 border-t border-line pt-8">
    <div class="flex flex-col items-center justify-between gap-4 text-sm text-muted sm:flex-row">
      <p>{{ t().footer.tagline }}</p>
      <nav class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2">
        <a href="#features" class="hover:text-twilight">{{ t().nav.features }}</a>
        <a href="#pricing" class="hover:text-twilight">{{ t().nav.pricing }}</a>
        <a href="#faq" class="hover:text-twilight">{{ t().nav.faq }}</a>
        <a routerLink="/privacy" class="hover:text-twilight">{{ t().footer.privacy }}</a>
        <a routerLink="/terms" class="hover:text-twilight">{{ t().footer.terms }}</a>
      </nav>
    </div>

    <p class="pointer-events-none mt-6 select-none text-center font-display text-[22vw] font-extrabold leading-[0.8] tracking-[-0.05em] text-twilight/10 sm:text-[18vw] lg:text-[260px]" aria-hidden="true">
      taxoffix
    </p>
    <p class="mt-4 text-center text-xs text-twilight/50">© {{ year }} Taxoffix. {{ t().footer.rights }}</p>
  </footer>
</section>
