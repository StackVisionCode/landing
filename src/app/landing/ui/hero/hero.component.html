<section class="relative overflow-hidden px-4 pb-20 pt-16 sm:px-6 lg:px-8">
  <div class="pointer-events-none absolute -top-24 left-1/4 h-72 w-72 rounded-full bg-indigo-200/40 blur-3xl"></div>
  <div class="pointer-events-none absolute -top-10 right-1/4 h-72 w-72 rounded-full bg-purple-200/40 blur-3xl"></div>

  <div class="relative mx-auto flex max-w-4xl flex-col items-center text-center">
    <h1 class="text-4xl font-bold leading-tight text-gray-900 sm:text-5xl">{{ t().heroTitle }}</h1>
    <p class="mt-6 max-w-2xl text-lg text-gray-500">{{ t().heroDescription }}</p>

    <div class="mt-8 flex flex-col gap-3 sm:flex-row">
      <a
        href="#pricing"
        class="rounded-full bg-gray-900 px-7 py-3 text-sm font-semibold text-white transition-colors hover:bg-gray-700"
      >
        {{ t().heroCtaPrimary }}
      </a>
      <button
        type="button"
        (click)="showBooking.set(true)"
        class="rounded-full border border-gray-200 bg-white px-7 py-3 text-sm font-semibold text-gray-900 transition-colors hover:bg-gray-50"
      >
        {{ t().heroCtaSecondary }}
      </button>
    </div>

    <div class="relative mt-16 w-full max-w-3xl">
      <div class="rounded-[28px] bg-white p-6 shadow-[0_24px_48px_rgba(17,24,39,0.12),0_8px_16px_rgba(17,24,39,0.06)]">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-500">Monthly Revenue</p>
            <p class="mt-1 text-3xl font-bold text-gray-900">$48,204</p>
          </div>
          <span class="flex items-center gap-1 rounded-full border border-emerald-200 px-3 py-1 text-xs font-semibold text-emerald-600">
            <ion-icon name="trending-up-outline"></ion-icon>
            +24%
          </span>
        </div>
        <div class="mt-6 flex h-24 items-end gap-2">
          @for (bar of revenueBars; track $index) {
            <div class="flex-1 rounded-full" [style.height.%]="bar.height" [style.background-color]="bar.color"></div>
          }
        </div>
      </div>

      <div class="absolute -left-6 -bottom-6 hidden rounded-[24px] bg-white p-4 shadow-[0_24px_48px_rgba(17,24,39,0.12),0_8px_16px_rgba(17,24,39,0.06)] sm:block">
        <div class="flex items-center gap-3">
          <span class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">
            <ion-icon name="people-outline" class="text-xl"></ion-icon>
          </span>
          <div>
            <p class="text-xs font-medium text-gray-400">Active Clients</p>
            <p class="text-lg font-bold text-gray-900">1,284</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-booking-modal
  [bookingId]="bookingId"
  [isOpen]="showBooking()"
  [heading]="t().heroCtaSecondary"
  (closed)="showBooking.set(false)"
/>
