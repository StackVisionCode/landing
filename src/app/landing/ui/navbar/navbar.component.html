<header class="sticky top-3 z-40 px-3 pt-3 sm:px-4 sm:pt-4">
  <div
    class="mx-auto max-w-5xl rounded-full border border-line shadow-[0_6px_20px_rgba(8,54,69,0.1)] transition-colors duration-300"
    [class.bg-white]="!scrolled()"
    [class.bg-white/85]="scrolled()"
    [class.backdrop-blur-md]="scrolled()"
  >
    <div
      class="flex items-center justify-between pl-5 pr-2 transition-[height] duration-300 sm:pl-6"
      [class.h-14]="!scrolled()"
      [class.h-12]="scrolled()"
    >
      <a href="#" class="flex items-center gap-2" aria-label="Taxoffix">
        <img src="img/logo-mark.png" alt="" class="h-7 w-auto" />
        <span class="ml-0.5 font-display text-[22px] font-extrabold tracking-tight text-twilight">Tax<span class="text-star">offix</span></span>
      </a>

      <nav class="relative hidden w-[380px] items-center justify-center gap-1 md:flex" (mouseleave)="onNavLeave()">
        <span
          class="pointer-events-none absolute inset-y-0.5 left-0 z-0 rounded-full bg-cream transition-[transform,width] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] motion-reduce:transition-none"
          [style.width.px]="sliderStyle().width"
          [style.transform]="'translateX(' + sliderStyle().left + 'px)'"
          [style.opacity]="sliderStyle().opacity"
        ></span>

        @for (link of navLinks(); track link.id) {
          <a
            #navLink
            [href]="'#' + link.id"
            (click)="scrollToSection($event, link.id)"
            (mouseenter)="onLinkHover(link.id)"
            class="relative z-10 rounded-full px-3.5 py-2 text-sm font-medium text-muted transition-colors hover:text-twilight"
            [class.text-twilight]="activeSection() === link.id"
          >
            {{ link.label }}
            @if (activeSection() === link.id) {
              <span class="absolute bottom-0.5 left-1/2 h-1 w-1 -translate-x-1/2 rounded-full bg-star"></span>
            }
          </a>
        }
      </nav>

      <div class="hidden items-center gap-2 md:flex">
        <div class="relative flex w-[84px] items-center rounded-full bg-cream p-0.5 text-xs font-semibold" role="group" aria-label="Idioma / Language">
          <span
            class="pointer-events-none absolute inset-y-0.5 left-0.5 w-[calc(50%-2px)] rounded-full bg-white shadow-sm transition-transform duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] motion-reduce:transition-none"
            [class.translate-x-full]="lang() === 'en'"
          ></span>
          <button
            type="button"
            (click)="lang() !== 'es' && toggleLang()"
            [attr.aria-pressed]="lang() === 'es'"
            class="relative z-10 flex-1 rounded-full py-1 text-center transition-colors duration-300"
            [class.text-twilight]="lang() === 'es'"
            [class.text-muted]="lang() !== 'es'"
          >
            ES
          </button>
          <button
            type="button"
            (click)="lang() !== 'en' && toggleLang()"
            [attr.aria-pressed]="lang() === 'en'"
            class="relative z-10 flex-1 rounded-full py-1 text-center transition-colors duration-300"
            [class.text-twilight]="lang() === 'en'"
            [class.text-muted]="lang() !== 'en'"
          >
            EN
          </button>
        </div>
        <div class="relative">
          <button
            type="button"
            (click)="toggleAccess($event)"
            aria-haspopup="menu"
            [attr.aria-expanded]="accessOpen()"
            class="flex items-center gap-1.5 rounded-full bg-twilight px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-star active:scale-95"
          >
            {{ t().access }}
            <ion-icon name="chevron-down-outline" class="text-sm transition-transform duration-300 motion-reduce:transition-none" [class.rotate-180]="accessOpen()"></ion-icon>
          </button>
          <div
            role="menu"
            class="absolute right-0 top-full mt-2 w-48 origin-top-right overflow-hidden rounded-2xl border border-line bg-white p-1.5 shadow-[0_12px_30px_rgba(8,54,69,0.18)] transition-[opacity,transform,visibility] duration-200 ease-out motion-reduce:transition-none"
            [class.visible]="accessOpen()"
            [class.opacity-100]="accessOpen()"
            [class.scale-100]="accessOpen()"
            [class.translate-y-0]="accessOpen()"
            [class.invisible]="!accessOpen()"
            [class.opacity-0]="!accessOpen()"
            [class.scale-95]="!accessOpen()"
            [class.-translate-y-1]="!accessOpen()"
          >
            <a
              role="menuitem"
              [routerLink]="signInPath"
              [attr.tabindex]="accessOpen() ? 0 : -1"
              class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-medium text-twilight transition-[background-color,opacity,transform] duration-300 hover:bg-cream motion-reduce:transition-none"
              [class.opacity-100]="accessOpen()"
              [class.translate-x-0]="accessOpen()"
              [class.delay-75]="accessOpen()"
              [class.opacity-0]="!accessOpen()"
              [class.-translate-x-2]="!accessOpen()"
            >
              <ion-icon name="log-in-outline" class="text-lg text-star"></ion-icon>
              {{ t().signIn }}
            </a>
            <a
              role="menuitem"
              [href]="siteConfig.appUrl"
              [attr.tabindex]="accessOpen() ? 0 : -1"
              class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-medium text-twilight transition-[background-color,opacity,transform] duration-300 hover:bg-cream motion-reduce:transition-none"
              [class.opacity-100]="accessOpen()"
              [class.translate-x-0]="accessOpen()"
              [class.delay-150]="accessOpen()"
              [class.opacity-0]="!accessOpen()"
              [class.-translate-x-2]="!accessOpen()"
            >
              <ion-icon name="apps-outline" class="text-lg text-star"></ion-icon>
              {{ t().goToApp }}
            </a>
          </div>
        </div>
      </div>

      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="flex h-10 w-10 items-center justify-center rounded-full text-twilight hover:bg-cream md:hidden"
        [attr.aria-label]="mobileMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        [attr.aria-expanded]="mobileMenuOpen()"
      >
        <ion-icon [name]="mobileMenuOpen() ? 'close-outline' : 'menu-outline'" class="text-2xl"></ion-icon>
      </button>
    </div>

    @if (mobileMenuOpen()) {
      <nav class="flex flex-col gap-1 border-t border-line px-3 py-3 md:hidden">
        @for (link of navLinks(); track link.id) {
          <a
            [href]="'#' + link.id"
            (click)="scrollToSection($event, link.id)"
            class="rounded-xl px-3 py-2.5 text-sm font-medium text-twilight transition-colors hover:bg-cream"
            [class.bg-cream]="activeSection() === link.id"
          >
            {{ link.label }}
          </a>
        }
        <a [routerLink]="signInPath" (click)="closeMobileMenu()" class="rounded-xl px-3 py-2.5 text-sm font-medium text-twilight hover:bg-cream">
          {{ t().signIn }}
        </a>
        <a [href]="siteConfig.appUrl" class="rounded-xl px-3 py-2.5 text-sm font-medium text-twilight hover:bg-cream">{{ t().goToApp }}</a>
        <div class="mt-1 flex items-center gap-3 border-t border-line pt-3">
          <button
            type="button"
            (click)="toggleLang()"
            class="rounded-full border border-line px-3 py-1.5 text-xs font-semibold text-muted"
          >
            {{ lang() === 'es' ? 'EN' : 'ES' }}
          </button>
        </div>
      </nav>
    }
  </div>
</header>
