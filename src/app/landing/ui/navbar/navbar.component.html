<header class="sticky top-0 z-40 border-b border-gray-100 bg-white/90 backdrop-blur-sm">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a href="#" class="flex items-center gap-1.5">
      <span class="text-2xl font-bold leading-none text-indigo-600">*</span>
      <span class="text-lg font-bold tracking-tight text-gray-900">TaxPro Office</span>
    </a>

    <nav class="hidden items-center gap-8 md:flex">
      <a href="#features" class="text-sm font-medium text-gray-500 hover:text-gray-900">{{ t().navFeatures }}</a>
      <a href="#products" class="text-sm font-medium text-gray-500 hover:text-gray-900">{{ t().navProducts }}</a>
      <a href="#pricing" class="text-sm font-medium text-gray-500 hover:text-gray-900">{{ t().navPricing }}</a>
      <a href="#faq" class="text-sm font-medium text-gray-500 hover:text-gray-900">{{ t().navFaq }}</a>
    </nav>

    <div class="hidden items-center gap-3 md:flex">
      <button
        type="button"
        (click)="toggleLang()"
        class="rounded-full border border-gray-200 px-3 py-1.5 text-xs font-semibold text-gray-500 hover:bg-gray-100"
      >
        {{ lang() === 'es' ? 'EN' : 'ES' }}
      </button>
      <button type="button" (click)="openAuthModal()" class="text-sm font-medium text-gray-500 hover:text-gray-900">
        {{ t().navSignIn }}
      </button>
      <a
        [href]="siteConfig.appUrl"
        class="rounded-full bg-gray-900 px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-gray-700"
      >
        {{ t().navGoToApp }}
      </a>
    </div>

    <button
      type="button"
      (click)="toggleMobileMenu()"
      class="flex h-10 w-10 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 md:hidden"
      aria-label="Abrir menú"
    >
      <ion-icon [name]="mobileMenuOpen() ? 'close-outline' : 'menu-outline'" class="text-2xl"></ion-icon>
    </button>
  </div>

  @if (mobileMenuOpen()) {
    <nav class="flex flex-col gap-1 border-t border-gray-100 bg-white px-4 py-4 md:hidden">
      <a (click)="closeMobileMenu()" href="#features" class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">{{ t().navFeatures }}</a>
      <a (click)="closeMobileMenu()" href="#products" class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">{{ t().navProducts }}</a>
      <a (click)="closeMobileMenu()" href="#pricing" class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">{{ t().navPricing }}</a>
      <a (click)="closeMobileMenu()" href="#faq" class="rounded-xl px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">{{ t().navFaq }}</a>
      <button
        (click)="openAuthModal()"
        class="rounded-xl px-3 py-2 text-left text-sm font-medium text-gray-700 hover:bg-gray-50"
      >
        {{ t().navSignIn }}
      </button>

      <div class="mt-2 flex items-center gap-3 border-t border-gray-100 pt-3">
        <button
          type="button"
          (click)="toggleLang()"
          class="rounded-full border border-gray-200 px-3 py-1.5 text-xs font-semibold text-gray-500"
        >
          {{ lang() === 'es' ? 'EN' : 'ES' }}
        </button>
        <a [href]="siteConfig.appUrl" class="flex-1 rounded-full bg-gray-900 px-5 py-2 text-center text-sm font-semibold text-white">
          {{ t().navGoToApp }}
        </a>
      </div>
    </nav>
  }
</header>

<app-auth-modal [isOpen]="showAuthModal()" (closed)="showAuthModal.set(false)" />
