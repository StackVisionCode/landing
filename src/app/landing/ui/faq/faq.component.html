<section id="faq" class="bg-white px-4 py-14 sm:px-8 sm:py-20 lg:px-16 lg:py-[88px]">
  <div class="mx-auto flex max-w-3xl flex-col items-center text-center">
    <h2 class="font-display text-3xl font-semibold leading-tight tracking-[-0.03em] text-twilight sm:text-5xl">
      {{ t().faq.titleA }}
      <span class="text-star">{{ t().faq.titleB }}</span>
    </h2>
  </div>

  <div class="mx-auto mt-10 flex max-w-[1100px] flex-col gap-3 sm:mt-12">
    @for (item of t().faq.items; track item.q; let i = $index) {
      <div class="rounded-2xl border border-line bg-cream">
        <h3>
          <button
            type="button"
            (click)="toggle(i)"
            [attr.aria-expanded]="openIndex() === i"
            class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left sm:px-6"
          >
            <span class="text-sm font-semibold text-twilight sm:text-[15px]">{{ item.q }}</span>
            <ion-icon [name]="openIndex() === i ? 'remove-outline' : 'add-outline'" class="shrink-0 text-lg text-muted"></ion-icon>
          </button>
        </h3>
        @if (openIndex() === i) {
          <p class="px-5 pb-5 text-sm leading-relaxed text-muted sm:px-6">{{ item.a }}</p>
        }
      </div>
    }
  </div>

  <div class="mt-8 flex justify-center">
    <button
      type="button"
      (click)="booking.open('faq')"
      class="rounded-full bg-twilight px-6 py-3 text-sm font-semibold text-white transition-colors hover:bg-star"
    >
      {{ t().scheduleDemo }}
    </button>
  </div>
</section>
