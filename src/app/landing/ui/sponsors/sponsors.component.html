<section class="border-y border-gray-100 bg-white py-10" (mouseenter)="stopRotation()" (mouseleave)="startRotation()">
  <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:px-8">
    @for (sponsor of sponsors; track sponsor.name; let i = $index) {
      @if (i === currentIndex()) {
        <div class="flex flex-col items-center gap-4 text-center sm:flex-row sm:text-left">
          <img [src]="sponsor.logo" [alt]="sponsor.name" class="h-12 w-auto object-contain" />
          <div>
            <p class="text-sm font-bold text-gray-900">{{ sponsor.name }}</p>
            <p class="text-sm text-gray-500">{{ sponsor.description }}</p>
          </div>
        </div>
      }
    }
    <div class="mt-4 flex justify-center gap-1.5">
      @for (sponsor of sponsors; track sponsor.name; let i = $index) {
        <span class="h-1.5 w-1.5 rounded-full" [class.bg-gray-900]="i === currentIndex()" [class.bg-gray-200]="i !== currentIndex()"></span>
      }
    </div>
  </div>
</section>
