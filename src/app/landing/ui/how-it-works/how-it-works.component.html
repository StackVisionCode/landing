<section class="mx-auto max-w-7xl px-4 py-20 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-2xl text-center">
    <span class="rounded-full border border-indigo-200 px-3 py-1 text-xs font-semibold text-indigo-600">{{ t().howItWorksBadge }}</span>
    <h2 class="mt-4 text-3xl font-bold text-gray-900 sm:text-4xl" [innerHTML]="t().howItWorksTitleHtml"></h2>
  </div>

  <div class="mt-12 grid grid-cols-1 gap-6 sm:grid-cols-3">
    <div class="rounded-[28px] bg-white p-6">
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-900 text-sm font-bold text-white">1</span>
      <h3 class="mt-4 text-xl font-bold text-gray-900">{{ t().step1Title }}</h3>
      <p class="mt-2 text-sm text-gray-500">{{ t().step1Description }}</p>
    </div>
    <div class="rounded-[28px] bg-white p-6">
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-900 text-sm font-bold text-white">2</span>
      <h3 class="mt-4 text-xl font-bold text-gray-900">{{ t().step2Title }}</h3>
      <p class="mt-2 text-sm text-gray-500">{{ t().step2Description }}</p>
    </div>
    <div class="rounded-[28px] bg-white p-6">
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-900 text-sm font-bold text-white">3</span>
      <h3 class="mt-4 text-xl font-bold text-gray-900">{{ t().step3Title }}</h3>
      <p class="mt-2 text-sm text-gray-500">{{ t().step3Description }}</p>
    </div>
  </div>
</section>
