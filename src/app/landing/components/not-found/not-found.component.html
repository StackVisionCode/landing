<div class="flex min-h-screen flex-col bg-[#FAFAFA]">
  <header class="border-b border-gray-100 bg-white/90 backdrop-blur-sm">
    <div class="mx-auto flex h-16 max-w-4xl items-center px-4 sm:px-6 lg:px-8">
      <a routerLink="/" class="flex items-center gap-1.5">
        <img src="brand/taxproffice-logo.svg" [alt]="brand" class="h-7 w-auto" />
      </a>
    </div>
  </header>

  <main class="not-found flex flex-1 flex-col items-center justify-center px-4 py-16 text-center">
    <!-- El infinito de la marca con un tramo apagado: "algo no conecta". Decorativo. -->
    <svg class="nf-flow" viewBox="0 0 64 32" fill="none" aria-hidden="true">
      <path class="nf-base" pathLength="100" [attr.d]="path" />
      <path class="nf-lit" pathLength="100" [attr.d]="path" />
    </svg>

    <span class="mt-8 text-xs font-semibold uppercase tracking-[0.18em] text-star">{{ t().notFoundEyebrow }}</span>
    <h1 class="mt-2 max-w-lg text-balance text-3xl font-bold tracking-tight text-ink sm:text-4xl">
      {{ t().notFoundTitle }}
    </h1>
    <p class="mt-3 max-w-md text-pretty text-base text-muted">{{ t().notFoundBody }}</p>

    <div class="mt-8 flex flex-col gap-3 sm:flex-row">
      <a routerLink="/"
        class="rounded-lg bg-twilight px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-star focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-star">
        {{ t().notFoundHome }}
      </a>
      <a routerLink="/account"
        class="rounded-lg border border-line bg-white px-5 py-2.5 text-sm font-semibold text-twilight transition-colors hover:border-star hover:text-star focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-star">
        {{ t().notFoundAccount }}
      </a>
    </div>
  </main>
</div>
