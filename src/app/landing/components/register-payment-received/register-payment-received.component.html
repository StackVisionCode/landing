<div class="flex min-h-screen flex-col bg-gray-50">
  <header class="border-b border-gray-100 bg-white/90 backdrop-blur-sm">
    <div class="mx-auto flex h-16 max-w-7xl items-center px-4 sm:px-6 lg:px-8">
      <a routerLink="/" class="flex items-center gap-1.5">
        <span class="text-2xl font-bold leading-none text-brand-800">*</span>
        <span class="text-lg font-bold tracking-tight text-gray-900">TaxPro Office</span>
      </a>
    </div>
  </header>

  <main class="flex flex-1 items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md rounded-[28px] bg-white p-8 text-center shadow-xl">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-green-50">
        <ion-icon name="checkmark-circle-outline" class="text-3xl text-green-600"></ion-icon>
      </div>
      <h1 class="mt-6 text-2xl font-bold text-gray-900">{{ t().payReceivedTitle }}</h1>
      <p class="mt-2 text-sm text-gray-600">{{ t().payReceivedBody }}</p>
      <a
        routerLink="/"
        class="mt-6 block w-full rounded-full bg-gray-900 py-2.5 text-center text-sm font-semibold text-white transition-colors hover:bg-gray-700"
      >
        {{ t().fpBackHome }}
      </a>
    </div>
  </main>
</div>
