@if (isOpen) {
  <div class="modal-backdrop fixed inset-0 z-50 flex items-stretch justify-center bg-black/20 sm:items-center sm:p-4" (click)="onBackdrop()">
    <div
      #panel
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="heading ? titleId : null"
      tabindex="-1"
      class="modal-panel h-full w-full overflow-y-auto bg-white p-6 shadow-xl focus:outline-none sm:h-auto sm:max-h-[90vh] sm:rounded-[28px]"
      [class]="sizeClass"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 [id]="titleId" class="text-xl font-bold text-gray-900">{{ heading }}</h2>
          @if (subheading) {
            <p class="mt-1 text-sm text-gray-500">{{ subheading }}</p>
          }
        </div>
        <button
          type="button"
          (click)="close()"
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-900 transition-colors"
          [attr.aria-label]="closeLabel"
        >
          <ion-icon name="close-outline" class="text-lg" aria-hidden="true"></ion-icon>
        </button>
      </div>

      <ng-content />
    </div>
  </div>
}
