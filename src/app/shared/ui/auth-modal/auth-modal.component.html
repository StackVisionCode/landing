<app-modal [isOpen]="isOpen" [heading]="t().authWelcomeBackTitle" [subheading]="t().authWelcomeBackSubtitle" size="md" (closed)="close()">
  <form (submit)="$event.preventDefault(); submitLogin()" class="mt-6 space-y-4">
    @if (loginError()) {
      <p class="rounded-xl bg-red-50 px-3 py-2 text-sm text-red-600">{{ loginError() }}</p>
    }

    <div>
      <label class="mb-1.5 block text-sm font-medium text-gray-700">{{ t().authEmailLabel }}</label>
      <input
        type="email"
        [ngModel]="loginEmail()"
        (ngModelChange)="loginEmail.set($event)"
        name="loginEmail"
        [placeholder]="t().authEmailPlaceholder"
        class="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600/30"
      />
    </div>

    <div>
      <label class="mb-1.5 block text-sm font-medium text-gray-700">{{ t().authPasswordLabel }}</label>
      <div class="relative">
        <input
          [type]="showLoginPassword() ? 'text' : 'password'"
          [ngModel]="loginPassword()"
          (ngModelChange)="loginPassword.set($event)"
          name="loginPassword"
          [placeholder]="t().authPasswordPlaceholder"
          class="w-full rounded-xl border border-gray-200 px-3 py-2.5 pr-10 text-sm focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600/30"
        />
        <button
          type="button"
          (click)="showLoginPassword.set(!showLoginPassword())"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600"
          aria-label="Toggle password visibility"
        >
          <ion-icon [name]="showLoginPassword() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between">
      <label class="flex items-center gap-2 text-sm text-gray-600">
        <input
          type="checkbox"
          [ngModel]="rememberMe()"
          (ngModelChange)="rememberMe.set($event)"
          name="rememberMe"
          class="rounded border-gray-300 text-brand-800 focus:ring-brand-600"
        />
        {{ t().authRememberMe }}
      </label>
      <button type="button" (click)="goToForgotPassword()" class="text-sm font-medium text-brand-800 hover:underline">
        {{ t().authForgotPassword }}
      </button>
    </div>

    <button
      type="submit"
      [disabled]="isLoggingIn()"
      class="w-full rounded-full bg-gray-900 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-gray-700 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ isLoggingIn() ? t().authSigningIn : t().authSignInButton }}
    </button>
  </form>
</app-modal>

<app-existing-session-modal
  [isOpen]="showExistingSessionModal()"
  [isLoading]="isForceLoggingIn()"
  (confirmed)="onForceLogin()"
  (cancelled)="onCancelForceLogin()"
/>
