server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2;

  # Assets con hash en el nombre -> cache larga e inmutable.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Ruta desconocida -> index.csr.html (shell vacío del routing del cliente Angular).
  #
  # NO index.html: ese archivo es el HOME pre-renderizado (121 KB de markup). Servirlo para
  # /account/continue pintaba el home y recién después Angular cambiaba de ruta; desde el CRM se veía
  # el home y luego el Account. index.csr.html trae solo la pantalla de carga y la app.
  #
  # OJO: "$uri/" (con slash) hace que nginx trate cualquier DIRECTORIO real
  # como "encontrado" aunque no tenga su propio index.html adentro, y
  # devuelve 403 (autoindex off) en vez de caer al fallback de la SPA. Esto
  # rompe rutas RenderMode.Client que tienen una hija RenderMode.Prerender
  # anidada (ej. /register no se prerenderiza, pero /register/payment-received
  # sí, así que el build deja un directorio "register/" sin index.html propio
  # -> "/register" y "/register/" devolvían 403 en vez de la SPA).
  # "$uri/index.html" en cambio solo matchea si ESE archivo existe de verdad.
  location / {
    try_files $uri $uri/index.html /index.csr.html;
  }

  # Los dos HTML de entrada nunca se cachean: cada deploy nuevo se ve al instante.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }
  location = /index.csr.html {
    add_header Cache-Control "no-store, must-revalidate";
  }
}
